# Cubo local para desarrollo. El índice es desechable (ADR 0001): se puede borrar el volumen.
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: odc
      POSTGRES_PASSWORD: odc
      POSTGRES_DB: odc
    ports:
      - "5432:5432"
    volumes:
      - indice-odc:/var/lib/postgresql/data
volumes:
  indice-odc:
