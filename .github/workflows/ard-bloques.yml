# ARD de una zona grande: un trabajo por mes. Cada trabajo corrige cada escena S1 una sola
# vez para toda la zona y luego calcula los bloques (teselas de la grilla nacional).
# En un PR con la etiqueta "medir" corre enero de 2024 en 4 bloques de La Macarena.
# A mano (Actions → "ARD por bloques" → Run workflow) se elige zona, meses y bloques.
name: ARD por bloques
on:
  # Cada corrida son ~2,5 h de runner: en un PR solo corre si tiene la etiqueta "medir".
  # Los cambios de código se prueban rápido en "ARD zona de prueba".
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      zona:
        description: Zona de config/zonas/
        default: macarena
      desde:
        description: Primer mes (AAAA-MM)
        default: "2024-01"
      hasta:
        description: Último mes (AAAA-MM)
        default: "2024-01"
      bloques:
        description: Bloques separados por coma; vacío = todos los de la zona
        default: ""
# un push nuevo cancela la medición anterior del mismo PR
concurrency:
  group: ard-bloques-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'medir')
    runs-on: ubuntu-latest
    outputs:
      meses: ${{ steps.lista.outputs.meses }}
    env:
      DESDE: ${{ inputs.desde || '2024-01' }}
      HASTA: ${{ inputs.hasta || '2024-01' }}
    steps:
      - id: lista
        run: |
          meses=$(python3 -c "
          import json, sys
          a, m = map(int, '$DESDE'.split('-')); fa, fm = map(int, '$HASTA'.split('-'))
          out = []
          while (a, m) <= (fa, fm):
              out.append(f'{a}-{m:02d}'); a, m = (a + (m == 12), m % 12 + 1)
          print(json.dumps(out))")
          echo "meses=$meses" >> "$GITHUB_OUTPUT"
          echo "::notice title=Meses::$meses"

  ard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        mes: ${{ fromJSON(needs.plan.outputs.meses) }}
    env:
      ZONA: ${{ inputs.zona || 'macarena' }}
      MES: ${{ matrix.mes }}
      BLOQUES: ${{ github.event_name == 'pull_request' && 'x479_y182,x480_y182,x479_y183,x480_y183' || inputs.bloques }}
      NO_COLOR: "1"
      CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
      CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # el runner trae ~14 GB libres; quitar SDKs que no se usan deja ~30 GB
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: uv sync --locked --extra cubo --extra radar
      - run: |
          set -o pipefail
          inicio=$(date +%s)
          opciones=()
          [ -n "$BLOQUES" ] && opciones=(--bloques "$BLOQUES")
          # cada línea con los segundos transcurridos, para saber qué etapa pesa
          uv run cdcol ard-mes "$ZONA" "$MES" --salida data "${opciones[@]}" 2>&1 \
            | while IFS= read -r l; do echo "$(( $(date +%s) - inicio ))s $l"; done | tee ard.log || {
            echo "::error title=ARD $MES::$({ head -n 8 ard.log; echo ...; grep -vE 'sys.excepthook|Original exception was|^[0-9]+s\s*$' ard.log | tail -n 30; } | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
          # una sola anotación con las etapas (los logs no se leen desde la API)
          echo "::notice title=Etapas $MES::$(grep -E '^[0-9]+s (RTC|20[0-9]{2}-|S2|S1|bloque)' ard.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::notice title=Peso $MES::$(du -sh data/$ZONA | cut -f1) de productos; disco libre $(df -h . | tail -1 | awk '{print $4}')"
      # si el proceso muere sin traza (p. ej. sin memoria), al menos se ve hasta dónde llegó
      - if: failure()
        run: |
          echo "::error title=Corte $MES::$({ tail -n 12 ard.log; free -h; } | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - run: |
          for b in $(ls data/$ZONA/ard_s1s2_mensual/); do
            fila=$(uv run cdcol resumen "$ZONA" --salida data --bloque "$b" | grep '^| 20')
            echo "$b $fila"
          done > resumen.txt
          echo "::notice title=Resumen $MES::$(sed ':a;N;$!ba;s/\n/%0A/g' resumen.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: ard-${{ env.ZONA }}-${{ matrix.mes }}
          path: data/
          retention-days: 14
