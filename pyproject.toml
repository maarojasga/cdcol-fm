[project]
name = "cdcol-fm"
version = "0.0.1"
description = "Open Data Cube con modelos fundacionales para Latinoamérica (Colombia como caso)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Cubo: ODC upstream sin forks (ADR 0002). Carga y procesa desde STAC, sin base de datos.
cubo = [
    "odc-stac>=0.4",
    "odc-geo>=0.4",
    "pystac>=1.10",
    "pystac-client>=0.8",
    "xarray>=2024.6",
    "dask[array]>=2024.6",
    "rioxarray>=0.15",
    "planetary-computer>=1.0",
]
# Radar desde Copernicus Data Space: GRD + corrección de relieve propia (sarsen).
radar = [
    "sarsen>=0.9",
    "boto3>=1.34",
]
# Índice ODC (caché desechable, ADR 0001). Necesita Postgres y pg_config para psycopg2.
indice = [
    "datacube[postgres]>=1.9",
    "odc-apps-dc-tools>=1.9",
]
# Experimentos (experimentos/): los clasificadores de los brazos.
bench = [
    "scikit-learn>=1.4",
]
# Modelos: se agregan en la fase 2.
modelos = [
    "torch>=2.3",
    "terratorch>=1.0",
    "peft>=0.11",
]

[project.scripts]
cdcol = "cdcol_fm.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdcol_fm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["cdcol_fm"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
